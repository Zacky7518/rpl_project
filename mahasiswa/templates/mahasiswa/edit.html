{% extends 'mahasiswa/base.html' %}
{% block content %}

<h2>Edit Mahasiswa</h2>
<form method="POST">
    {% csrf_token %}
    <table>
        <tr>
            <td>NIM</td>
            <td><input type="text" name="nim" value="{{ mhs.nim }}" required></td>
        </tr>
        <tr>
            <td>Nama</td>
            <td><input type="text" name="nama" value="{{ mhs.nama }}" required></td>
        </tr>
        <tr>
            <td>Program Studi</td>
            <td><input type="text" name="programstudi" value="{{ mhs.programstudi }}" required></td>
        </tr>
        <tr>
            <td>Angkatan</td>
            <td><input type="number" name="angkatan" value="{{ mhs.angkatan }}" required></td>
        </tr>
        <tr>
            <td></td>
            <td>
                <button type="submit">Update</button>
                <a href="{% url 'daftar_mahasiswa' %}">Batal</a>
            </td>
        </tr>
    </table>
</form>

{% endblock %}

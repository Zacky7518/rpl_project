{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}RPL Django{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'mahasiswa/css/style.css' %}">
</head>
<body>
    <header>
        <h1>Praktikum RPL - Django</h1>
        <nav>
            {% if user.is_authenticated %}
                <span>Halo, {{ user.username }}!</span>
                <a href="{% url 'logout' %}">Logout</a>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
            {% endif %}
        </nav>
    </header>
    
    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2025 - Praktikum</p>
    </footer>
</body>
</html>

{% extends 'mahasiswa/base.html' %}
{% block content %}

<h2>Tambah Mahasiswa</h2>
<form method="POST">
    {% csrf_token %}
    <table>
        <tr>
            <td>NIM</td>
            <td><input type="text" name="nim" required></td>
        </tr>
        <tr>
            <td>Nama</td>
            <td><input type="text" name="nama" required></td>
        </tr>
        <tr>
            <td>Program Studi</td>
            <td><input type="text" name="programstudi" required></td>
        </tr>
        <tr>
            <td>Angkatan</td>
            <td><input type="number" name="angkatan" required></td>
        </tr>
        <tr>
            <td></td>
            <td>
                <button type="submit">Simpan</button>
                <a href="{% url 'daftar_mahasiswa' %}">Batal</a>
            </td>
        </tr>
    </table>
</form>

{% endblock %}
